name: Deploy Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: staging
    secrets: inherit

  deploy:
    name: Deploy to Staging
    runs-on: self-hosted
    needs: ci
    environment: staging
    # Job-level env so every `docker compose` invocation (pull, up, down) can
    # interpolate the compose file — the file's `${PUBLIC_API_URL:?...}` guard
    # otherwise fails the `pull` step before we get to `up`.
    env:
      PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      ORIGIN: ${{ secrets.STAGING_ORIGIN }}
      PORT: ${{ vars.PORT }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker compose pull

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Clean up old images
        run: docker image prune -f
