name: CI

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Deployment environment (staging or production)"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rtb-rwanda-tvet-board/tdmp-web

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run check

  build-and-push:
    name: Build & Push Docker Image
    needs: lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PUBLIC_API_URL is no longer baked at build time — it's read at runtime
      # via $env/dynamic/public, set per-environment by the deploy step.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.environment }}-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest-${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
