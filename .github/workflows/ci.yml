name: CI

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Deployment environment (staging or production)"
      public_api_url:
        required: true
        type: string
        description: "PUBLIC_API_URL to bake into the build"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rtb-rwanda-tvet-board/tdmp-web

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_API_URL=${{ inputs.public_api_url }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.environment }}-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest-${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
